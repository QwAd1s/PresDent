# PresiDent: приложение + PostgreSQL.
# Запуск:  docker compose up -d --build
# Открыть: http://localhost:8787

name: president

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-president}
      POSTGRES_USER: ${POSTGRES_USER:-president}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-president}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-president} -d ${POSTGRES_DB:-president}']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8787
      NODE_ENV: production
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-president}:${POSTGRES_PASSWORD:-president}@db:5432/${POSTGRES_DB:-president}
      # пароль сотрудников при первом создании базы — смените перед публикацией
      SEED_PASSWORD: ${SEED_PASSWORD:-president2026}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8787}
      DRY_RUN: ${DRY_RUN:-true}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_STAFF_CHAT_ID: ${TELEGRAM_STAFF_CHAT_ID:-}
    ports:
      - '8787:8787'
    restart: unless-stopped

volumes:
  pgdata:
